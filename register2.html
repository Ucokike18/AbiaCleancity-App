<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Uche Okike">
    <meta name="description" content="AbiaCleanCity - Smart Waste Management">
    <title>AbiaCleanCity - Smart Waste Management Complete Registration</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<section class="form-container">

<!-- Progress Bar -->
<div class="progress">
<div class="step completed">1</div>
<div class="line"></div>
<div class="step active">2</div>
</div>

<h2>Complete Your Registration</h2>

<!-- Prefilled User Info -->
<div class="user-preview">

    <label>Full Name</label>
    <input type="text" id="previewName" readonly>

    <label>Email</label>
    <input type="email" id="previewEmail" readonly>

    <label>Phone</label>
    <input type="text" id="previewPhone" readonly>

</div>

<!-- Validation Message -->
<p id="errorMsg" class="error"></p>

<form id="registerStep2">

    <label>Address</label>
    <input type="text" id="address">

    <label>Type of Building</label>
    <select id="buildingType">
        <option value="">Select</option>
        <option value="Residential">Residential</option>
        <option value="Shop">Shop</option>
        <option value="Business">Business Premises</option>
    </select>

    <label>User Type</label>
    <select id="userType">
        <option value="">Select</option>
        <option value="Landlord">Landlord</option>
        <option value="Tenant">Tenant</option>
    </select>

    <button type="submit">Complete Registration</button>

</form>

</section>

<script src="/js/script.js"></script>

</body>
</body>
