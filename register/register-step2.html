<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Uche Okike">
    <meta name="description" content="Complete your AbiaCleanCity resident profile.">

    <title>Complete Registration | AbiaCleanCity</title>

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header>
        <h1>AbiaCleanCity</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="registration-page">

        <section class="form-container registration-container">

            <!-- Progress -->
            <div class="progress" aria-label="Registration progress">

                <div class="step completed">1</div>

                <div class="line completed-line"></div>

                <div class="step active">2</div>

            </div>

            <h2>Complete Your Registration</h2>

            <p class="form-intro">
                Tell us a little more about your residence so we can provide
                the right waste management services.
            </p>

            <!-- Registered user preview -->
            <div class="user-preview">

                <h3>Your Information</h3>

                <div class="preview-item">
                    <span>Full Name</span>
                    <strong id="previewName">-</strong>
                </div>

                <div class="preview-item">
                    <span>Email</span>
                    <strong id="previewEmail">-</strong>
                </div>

                <div class="preview-item">
                    <span>Phone</span>
                    <strong id="previewPhone">-</strong>
                </div>

            </div>

            <div id="errorMsg" class="error" role="alert"></div>

            <form id="registerStep2" novalidate>

                <div class="form-group">

                    <label for="address">
                        Residential Address
                    </label>

                    <input type="text" id="address" name="address" placeholder="Enter your residential address"
                        autocomplete="street-address" required>

                </div>

                <div class="form-group">

                    <label for="buildingType">
                        Type of Building
                    </label>

                    <select id="buildingType" name="buildingType" required>
                        <option value="">Select building type</option>
                        <option value="Residential">Residential</option>
                        <option value="Shop">Shop</option>
                        <option value="Business Premises">
                            Business Premises
                        </option>
                    </select>

                </div>

                <div class="form-group">

                    <label for="userType">
                        Resident Type
                    </label>

                    <select id="userType" name="userType" required>
                        <option value="">Select resident type</option>
                        <option value="Landlord">Landlord</option>
                        <option value="Tenant">Tenant</option>
                    </select>

                </div>

                <button type="submit" class="form-button">
                    Create Account
                </button>

            </form>

            <button type="button" id="backButton" class="back-button">
                Back
            </button>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 AbiaCleanCity. All rights reserved.</p>
    </footer>

    <script src="/js/register-step2.js"></script>

</body>

</html>
